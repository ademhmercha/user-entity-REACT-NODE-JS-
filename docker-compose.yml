services:
  mongodb:
    image: mongo:7
    container_name: user-auth-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: user-auth-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/user-auth
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - CLIENT_URL=http://localhost:80
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - PORT=5000
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: user-auth-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo-data:
